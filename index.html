<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skripka Flappy — Nota ilə Uç</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  
  

  <div class="stage-wrap">
    <canvas id="game"></canvas>

    <div class="hud">
      <div class="score" id="scoreEl">0</div>
      <div class="pitch-readout" id="pitchEl">— <br><b>—</b></div>
    </div>

    <div class="overlay" id="startOverlay">
      <h2>Başlamazdan əvvəl</h2>
      <p>Mikrofon icazəsi lazımdır. Skripkanı yaxınlaşdır və ya səslə oxu — proqram avtomatik tezliyi (Hz) tutub notaya çevirəcək.</p>
      <div class="note-legend" id="legend"></div>
      <button class="primary" id="startBtn">Mikrofonu aç və başla</button>
      <div class="mic-status" id="micStatus"></div>
    </div>

    <div class="overlay" id="overOverlay" style="display:none;">
      <h2>Oyun bitdi</h2>
      <div class="final-score" id="finalScore">0</div>
      <p id="overNote"></p>
      <button class="primary" id="retryBtn">Yenidən cəhd et</button>
    </div>
  </div>
  
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
